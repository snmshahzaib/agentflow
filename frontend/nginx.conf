server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Keep the server's identity and version out of responses.
    server_tokens off;

    # Docker's embedded DNS. Without a resolver, nginx resolves an upstream
    # name ONCE at startup and caches the address forever -- so recreating the
    # api container (any redeploy) leaves the frontend serving 502s until
    # nginx itself is restarted. Assigning the upstream to a variable forces
    # re-resolution per request, with this resolver and TTL.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed assets are immutable; index.html must never be cached or a
    # deploy would keep serving the previous bundle.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Single origin for the browser: same-origin /api means the session
    # cookie needs no cross-site relaxation.
    location /api/ {
        # $request_uri is required with a variable upstream: nginx no longer
        # appends the matched location path automatically.
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /docs {
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $host;
    }

    location = /ready {
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $host;
    }

    # SPA fallback, last so it cannot shadow the proxies above.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
