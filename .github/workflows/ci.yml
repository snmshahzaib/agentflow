name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# No credentials are stored in this file. When live-provider tests become
# necessary they will read from GitHub Secrets, and the default offline
# configuration (LLM_PROVIDER=stub, SEARCH_PROVIDER=fixture) keeps CI
# network-free and deterministic until then.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  GITLEAKS_VERSION: "8.30.1"

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history: a secret in an old commit still counts

      - name: Install gitleaks (pinned)
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks version

      - name: Scan working tree
        run: ./gitleaks dir . --config .gitleaks.toml --redact --no-banner --exit-code 1

      - name: Scan full git history
        run: ./gitleaks git . --config .gitleaks.toml --redact --no-banner --exit-code 1

  backend:
    name: Backend (lint, types, boundaries, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: agentflow
          POSTGRES_PASSWORD: agentflow
          POSTGRES_DB: agentflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agentflow"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      APP_ENV: test
      LLM_PROVIDER: stub
      SEARCH_PROVIDER: fixture
      DATABASE_URL: postgresql+asyncpg://agentflow:agentflow@localhost:5432/agentflow_test
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies (locked)
        run: uv sync --extra dev --frozen

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy app

      - name: Architecture import boundaries
        run: uv run lint-imports

      - name: Tests
        run: uv run pytest --cov=app --cov-report=term-missing

  dependency-audit:
    name: Dependency audit (advisory)
    runs-on: ubuntu-latest
    # Advisory: a newly published advisory should surface here without
    # blocking unrelated work. Findings are triaged, not ignored.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Audit Python dependencies
        working-directory: backend
        run: |
          uv export --no-hashes --format requirements-txt > /tmp/requirements.txt
          uvx pip-audit --requirement /tmp/requirements.txt --strict
