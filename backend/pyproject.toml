[project]
name = "agentflow-backend"
version = "0.1.0"
description = "AgentFlow — human-in-the-loop multi-agent research orchestrator (API + worker)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.163.1,<1",
    # Security floor: pip-audit flagged PYSEC-2026-248/249/2280/2281 in
    # starlette < 1.3.1, which older FastAPI releases pinned us below.
    "starlette>=1.3.1,<2",
    "uvicorn[standard]>=0.34,<0.40",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "asyncpg>=0.30,<0.31",
    "alembic>=1.14,<2",
    "arq>=0.26,<0.27",
    "redis>=5.2,<7",
    "httpx>=0.28,<0.29",
    "structlog>=24.4,<26",
    "openai>=1.60,<3",
    "langgraph>=0.2.60,<2",
    # >=3.1.3 and the transitive floors below are security floors, not
    # preferences: pip-audit flagged PYSEC-2026-3635, CVE-2026-115883,
    # PYSEC-2026-2573/2574 and PYSEC-2026-4240 in the earlier releases.
    "langgraph-checkpoint-postgres>=3.1.3,<5",
    "langgraph-checkpoint>=4.1.1,<5",
    "langgraph-sdk>=0.4.4,<1",
    "psycopg[binary,pool]>=3.2,<4",
    "tenacity>=9.0,<10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<2",
    "pytest-cov>=6.0,<9",
    "ruff>=0.8,<0.16",
    "mypy>=1.13,<2",
    "import-linter>=2.1,<3",
    "asgi-lifespan>=2.1,<3",
    # Bounds a hung live provider call at the test level, in addition to the
    # adapter's own client timeout.
    "pytest-timeout>=2.3,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ASYNC", "S", "T20"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
# Operator CLIs: printing is their output, and blocking IO at the end of a
# one-shot script is not worth an async file API.
"scripts/*" = ["T201", "ASYNC230"]
"migrations/*" = ["E501", "I001"]
"app/adapters/llm/pricing.py" = ["S110"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_reexport = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["app.domain.*", "app.services.*", "app.adapters.*"]
strict = true

[[tool.mypy.overrides]]
module = ["langgraph.*", "arq.*", "alembic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: requires Postgres and Redis",
    "live: makes billable calls to a real LLM provider; skipped unless LLM_PROVIDER=openrouter and LLM_API_KEY are set",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/workers/settings.py", "migrations/*"]
